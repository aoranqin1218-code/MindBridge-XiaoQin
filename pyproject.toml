# 构建后端声明：用 setuptools 把本项目做成"可编辑安装"，从而注册下面的命令行入口
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindbridge-py"
version = "0.1.0"
description = "MindBridge: 校园心理支持多 Agent 系统（学习项目）"
requires-python = ">=3.10"
# 依赖刻意不在此声明：沿用 requirements.txt，避免两处重复维护

# 命令行快捷入口：pip install -e . 之后，可直接使用下面的项目命令
[project.scripts]
mindbridge-harness = "app.harness.runner:main"
mindbridge-rag-eval = "app.rag_eval.runner:main"

# 只把 app 包纳入打包范围，避免误收 target/tests 等非包目录
[tool.setuptools.packages.find]
include = ["app*"]
